spring:
  application:
    name: 1БАС24015
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rbpo}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
server:
  port: 1218
security:
  jwt:
    secret: ${JWT_SECRET}
    access-lifetime-seconds: ${JWT_ACCESS_LIFETIME_SECONDS:900}
    refresh-lifetime-seconds: ${JWT_REFRESH_LIFETIME_SECONDS:604800}
